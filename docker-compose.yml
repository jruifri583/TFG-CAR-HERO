services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: carhero_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app:cached
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:8000
      VITE_APP_NAME: TFG-CAR-HERO
      VITE_ENV: development
    command: ["sh", "-c", "npm install && npm run dev -- --host"]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    #      args:
    #        UID: ${UID}
    #        GID: ${GID}
    container_name: ${PROJECT_NAME}_backend
    ports:
      - "${BACKEND_PORT}:8000"
    volumes:
      # Código desde el host; vendor en volumen nativo de Docker (mucho más rápido en Windows/macOS).
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: ${DB_PORT}
      DB_DATABASE: ${MYSQL_DATABASE}
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}

  db:
    image: mysql:8.0
    container_name: ${PROJECT_NAME}_mysql
    restart: always
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "${DB_PORT}:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test:
        ["CMD", "mysqladmin", "ping", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: ${PROJECT_NAME}_phpmyadmin
    restart: always
    ports:
      - "${PHPMYADMIN_PORT}:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
  backend_vendor:
