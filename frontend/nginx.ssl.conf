# =============================================================================
#  CAR-HERO — Nginx con SSL (carhero.duckdns.org)
# =============================================================================
#  Este fichero se activa tras obtener el certificado SSL con Certbot.
#  Uso: cp frontend/nginx.ssl.conf frontend/nginx.conf
#       docker compose -f docker-compose.prod.yml exec frontend nginx -s reload
# =============================================================================

# Redirigir HTTP → HTTPS
server {
    listen 80;
    server_name carhero.duckdns.org;

    # Desafío de Certbot (renovación automática)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirigir todo lo demás a HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl;
    server_name carhero.duckdns.org;

    # ── Certificados Let's Encrypt ──
    ssl_certificate /etc/letsencrypt/live/carhero.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/carhero.duckdns.org/privkey.pem;

    # ── Seguridad SSL ──
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # ── Cabeceras de seguridad ──
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # ── Frontend (React) ──
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Proxy al Backend (Laravel) ──
    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Imágenes por defecto (avatars) ──
    location /avatars/ {
        proxy_pass http://backend:8000;
    }

    # ── Archivos de storage (imágenes subidas) ──
    location /storage/ {
        proxy_pass http://backend:8000;
    }
}
